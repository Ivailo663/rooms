name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Monorepo: only the client workspace is built for Hosting. Type-checking
      # is ci.yml's job, so this is the plain Vite build into client/dist.
      - run: npm run build-only -w client
        env:
          VITE_API_URL: https://rooms-84d6.onrender.com
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLAYGROUNDS_C9391 }}
          channelId: live
          projectId: playgrounds-c9391
