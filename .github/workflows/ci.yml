name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  specs-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Unit tests import @prisma/client types, so the client must be generated.
      - run: npm run prisma:generate -w server
      - run: npm run spec:check
      - run: npm test
      # Both workspaces. Tests run through esbuild and never type-check, so
      # without this a type error lands green — which is how the client's
      # Promise.withResolvers error reached main.
      - run: npm run type-check
      # e2e is left out on purpose: it needs Supabase, Redis and Firebase creds.
